name: Bug report
description: Something in the log, the MCP server or an update doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Found a vulnerability? Don't report it here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release in your install's .template/manifest.json, like v1.1.0.
  - type: dropdown
    id: app
    attributes:
      label: AI app
      options: [Claude, ChatGPT, Grok, Cursor, Claude Code, An API agent, None]
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: The error text or the rule a change broke. Remove anything private first.
